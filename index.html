<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elder Gnome Roulette</title>
    <!-- Importing a pixel font to mimic OSRS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --osrs-bg-dark: #2b2620;
            --osrs-bg-panel: #5e5245;
            --osrs-border-light: #9e9081;
            --osrs-border-dark: #271c12;
            --osrs-text: #ff981f;
            --osrs-text-white: #ffffff;
            --osrs-btn-bg: #5c5142;
            --osrs-btn-hover: #6e6251;
            --osrs-green: #00ff00;
            --inventory-slot: #3e3529;
            --inventory-hover: #5f5242;
            --wheel-border: #d4c4a8;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--osrs-bg-dark);
            font-family: 'VT323', monospace;
            color: var(--osrs-text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            background-image: radial-gradient(#3e3529 15%, transparent 16%), radial-gradient(#3e3529 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        /* --- UI Components --- */
        .rs-panel {
            background-color: var(--osrs-bg-panel);
            border: 2px solid var(--osrs-border-dark);
            border-top-color: var(--osrs-border-light);
            border-left-color: var(--osrs-border-light);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            position: relative;
        }

        .rs-button {
            background-color: var(--osrs-btn-bg);
            border: 2px solid var(--osrs-border-dark);
            border-top-color: var(--osrs-border-light);
            border-left-color: var(--osrs-border-light);
            color: var(--osrs-text-white);
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            padding: 5px 15px;
            text-shadow: 1px 1px 0 #000;
        }
        .rs-button:active {
            border-top-color: var(--osrs-border-dark);
            border-left-color: var(--osrs-border-dark);
            border-bottom-color: var(--osrs-border-light);
            border-right-color: var(--osrs-border-light);
            transform: translateY(2px);
        }
        .rs-button:hover {
            background-color: var(--osrs-btn-hover);
            color: #ffff00;
        }
        .rs-button:disabled {
            background-color: #333;
            color: #777;
            cursor: not-allowed;
            border-color: #222;
        }

        /* --- Layout --- */
        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            text-shadow: 2px 2px 0 #000;
            z-index: 10;
        }
        h1 {
            margin: 0;
            font-size: 3rem;
            letter-spacing: 2px;
            color: #00ff00;
            -webkit-text-stroke: 1px black;
        }
        h2 { margin: 0; font-size: 1.5rem; color: #d4c4a8; }

        main {
            display: flex;
            gap: 20px;
            width: 95%;
            max-width: 1100px;
            height: 70vh;
            justify-content: center;
        }

        /* --- Left Column: Wheel Stage --- */
        .stage-panel {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            padding: 15px;
            align-items: center;
            justify-content: center;
        }

        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin-bottom: 20px;
            /* OSRS Widget bevel look */
            border: 4px solid var(--osrs-border-dark);
            border-top-color: var(--osrs-border-light);
            border-left-color: var(--osrs-border-light);
            background: #1a1510;
            box-shadow: inset 0 0 20px #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.1, 0, 0.2, 1); /* Ease-out spin */
        }

        /* The Triangle Pointer */
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ffff00;
            z-index: 5;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.8));
        }

        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .spin-btn {
            font-size: 2rem;
            flex-grow: 1;
            background-image: linear-gradient(to bottom, #5c5142, #42382c);
            font-weight: bold;
        }

        /* --- Right Column: Inventory --- */
        .inventory-panel {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--osrs-border-dark);
            padding-bottom: 5px;
        }

        .input-group { display: flex; gap: 5px; margin-bottom: 10px; }

        .rs-input {
            background: #000;
            border: 1px solid var(--osrs-border-light);
            color: var(--osrs-text-white);
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            flex-grow: 1;
            padding: 2px 5px;
            outline: none;
        }
        .rs-input:focus { border-color: var(--osrs-green); }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 4px;
            overflow-y: auto;
            padding: 4px;
            background-color: rgba(0,0,0,0.2);
            border: 1px inset var(--osrs-border-dark);
            min-height: 200px;
        }

        .inv-slot {
            aspect-ratio: 1;
            background-color: var(--inventory-slot);
            border: 1px solid #5e5245;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            font-size: 0.7rem;
            color: #ff981f;
            text-align: center;
            padding: 2px;
            word-break: break-all;
            line-height: 1;
            transition: background 0.2s;
        }
        .inv-slot:hover { background-color: var(--inventory-hover); border-color: var(--osrs-text-white); }
        
        .inv-slot:hover::after {
            content: attr(data-name);
            position: absolute;
            bottom: 105%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #ffff00;
            padding: 2px 5px;
            font-size: 1rem;
            border: 1px solid #ffff00;
            white-space: nowrap;
            z-index: 100;
            pointer-events: none;
        }

        .slot-remove {
            position: absolute;
            top: -2px;
            right: -2px;
            background: red;
            color: white;
            font-size: 0.8rem;
            width: 14px;
            height: 14px;
            line-height: 12px;
            text-align: center;
            border-radius: 50%;
            display: none;
        }
        .inv-slot:hover .slot-remove { display: block; }

        /* --- Chat & Overlays --- */
        .chat-container {
            width: 95%;
            max-width: 1100px;
            height: 100px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
        }
        .chat-history {
            flex-grow: 1;
            background-color: rgba(0,0,0,0.6);
            color: #fff;
            padding: 5px;
            font-size: 1rem;
            overflow-y: auto;
            border: 1px solid #444;
            border-bottom: none;
        }
        .chat-msg { margin-bottom: 2px; }
        .chat-msg.system { color: #ffff00; }
        .chat-msg.win { color: var(--osrs-green); font-weight: bold; }
        .chat-msg.info { color: #d4c4a8; }

        /* Winner Overlay */
        .winner-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .winner-overlay.active { visibility: visible; opacity: 1; }
        .level-up-box {
            text-align: center;
            border: 4px solid #fff;
            padding: 20px;
            background: linear-gradient(to bottom, #3e3529, #1a1510);
            box-shadow: 0 0 20px var(--osrs-green);
        }
        .level-up-title { font-size: 3rem; color: var(--osrs-green); margin-bottom: 10px; }
        .winner-name { font-size: 4rem; color: #ffff00; margin-bottom: 20px; text-shadow: 3px 3px 0 #000; }

        @media (max-width: 700px) {
            main { flex-direction: column; height: auto; }
            .wheel-container { width: 260px; height: 260px; }
            .inventory-panel { height: 300px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Elder Gnome</h1>
        <h2>Group Roulette</h2>
    </header>

    <main>
        <!-- LEFT: Wheel -->
        <div class="rs-panel stage-panel">
            <div class="wheel-container">
                <div class="pointer"></div>
                <canvas id="wheelCanvas" width="400" height="400"></canvas>
            </div>

            <div class="controls">
                <button class="rs-button spin-btn" id="spinBtn" onclick="spinWheel()">SPIN</button>
            </div>
            
            <div style="margin-top: 15px; width: 100%; text-align: center; font-size: 1rem;">
                <label style="color: #d4c4a8;">Speed: </label>
                <select id="speedSelect" class="rs-input" style="width: 80px; padding: 2px;">
                    <option value="high">High</option>
                    <option value="medium" selected>Normal</option>
                    <option value="low">Slow</option>
                </select>
            </div>
        </div>

        <!-- RIGHT: Inventory -->
        <div class="rs-panel inventory-panel">
            <div class="panel-header">
                <span style="color: #ff981f; font-size: 1.2rem;">Friends List</span>
                <span style="color: #fff; font-size: 1rem;" id="countDisplay">0/28</span>
            </div>

            <div class="input-group">
                <input type="text" id="nameInput" class="rs-input" placeholder="Enter name..." maxlength="12">
                <button class="rs-button" onclick="addName()">Add</button>
                <button class="rs-button" onclick="clearNames()" style="background-color: #800000;">X</button>
            </div>

            <div class="inventory-grid" id="inventoryGrid"></div>
        </div>
    </main>

    <!-- BOTTOM: Chat -->
    <div class="rs-panel chat-container">
        <div class="chat-history" id="chatHistory">
            <div class="chat-msg system">Welcome to the Elder Gnome roulette.</div>
            <div class="chat-msg info">Winners are removed from the list automatically.</div>
        </div>
    </div>

    <!-- WINNER OVERLAY -->
    <div class="winner-overlay" id="winnerOverlay">
        <div class="level-up-box">
            <div class="level-up-title">Congratulations!</div>
            <div>The chosen Gnome is:</div>
            <div class="winner-name" id="winnerNameText">Name</div>
            <button class="rs-button" onclick="closeOverlay()">Click to continue</button>
        </div>
    </div>

    <script>
        // --- State Management ---
        let names = [];
        const STORAGE_KEY = 'elder_gnome_list_v2'; // Updated key for new version
        let currentRotation = 0;
        let isSpinning = false;
        
        // Colors for wheel slices (OSRS palette)
        const COLORS = ['#5e5245', '#3e3529', '#6e6251', '#4e4235'];

        // --- DOM Elements ---
        const nameInput = document.getElementById('nameInput');
        const grid = document.getElementById('inventoryGrid');
        const spinBtn = document.getElementById('spinBtn');
        const chatHistory = document.getElementById('chatHistory');
        const countDisplay = document.getElementById('countDisplay');
        const winnerOverlay = document.getElementById('winnerOverlay');
        const winnerNameText = document.getElementById('winnerNameText');
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');

        // --- Init ---
        window.onload = () => {
            loadNames();
            renderGrid();
            drawWheel();
            if(names.length === 0) logMessage("Inventory empty. Add some friends!", "system");
            else logMessage(`Loaded ${names.length} friends from storage.`, "info");
        };

        // --- Core Functions ---
        function addName() {
            const val = nameInput.value.trim();
            if (!val) { shakeElement(nameInput); return; }
            if (names.length >= 28) { logMessage("Inventory full! Remove someone first.", "system"); return; }
            if (names.includes(val)) { logMessage(`${val} is already in the list.`, "system"); return; }
            
            names.push(val);
            saveNames();
            renderGrid();
            drawWheel(); // Update wheel visual
            
            nameInput.value = '';
            nameInput.focus();
            logMessage(`Added ${val} to the list.`, "info");
        }

        function removeName(index) {
            const removed = names[index];
            names.splice(index, 1);
            saveNames();
            renderGrid();
            drawWheel(); // Update wheel visual
            logMessage(`Removed ${removed}.`, "info");
        }

        function clearNames() {
            if(confirm("Are you sure you want to clear the list?")) {
                names = [];
                saveNames();
                renderGrid();
                drawWheel();
                logMessage("List cleared.", "system");
            }
        }

        function renderGrid() {
            grid.innerHTML = '';
            countDisplay.innerText = `${names.length}/28`;

            names.forEach((name, index) => {
                const slot = document.createElement('div');
                slot.className = 'inv-slot';
                slot.title = name; 
                slot.setAttribute('data-name', name);
                
                const text = document.createElement('span');
                text.innerText = name.substring(0, 3).toUpperCase(); 
                text.style.fontSize = '0.9rem';
                
                const removeBtn = document.createElement('div');
                removeBtn.className = 'slot-remove';
                removeBtn.innerText = 'X';
                removeBtn.onclick = (e) => {
                    e.stopPropagation();
                    removeName(index);
                };

                slot.appendChild(text);
                slot.appendChild(removeBtn);
                grid.appendChild(slot);
            });
        }

        function saveNames() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(names));
        }

        function loadNames() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try { names = JSON.parse(saved); } 
                catch (e) { names = []; }
            }
        }

        function logMessage(msg, type = "info") {
            const div = document.createElement('div');
            div.className = `chat-msg ${type}`;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            div.innerText = `[${time}] ${msg}`;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function shakeElement(el) {
            el.style.transform = "translateX(5px)";
            setTimeout(() => el.style.transform = "translateX(-5px)", 50);
            setTimeout(() => el.style.transform = "translateX(5px)", 100);
            setTimeout(() => el.style.transform = "none", 150);
        }

        // --- Wheel Logic (Canvas) ---
        
        function drawWheel() {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = width / 2 - 10;

            ctx.clearRect(0, 0, width, height);

            // Draw Background/Border
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 5, 0, 2 * Math.PI);
            ctx.fillStyle = "#271c12";
            ctx.fill();

            if (names.length === 0) {
                // Empty State Wheel
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = "#3e3529";
                ctx.fill();
                ctx.strokeStyle = "#5e5245";
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.fillStyle = "#777";
                ctx.font = "30px VT323";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("Empty", centerX, centerY);
                return;
            }

            const arcSize = (2 * Math.PI) / names.length;

            for (let i = 0; i < names.length; i++) {
                const angle = i * arcSize;
                
                // Slice
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
                ctx.fillStyle = COLORS[i % COLORS.length];
                ctx.fill();
                ctx.stroke(); // separator line

                // Text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ff981f";
                ctx.font = "24px VT323";
                ctx.shadowColor = "black";
                ctx.shadowBlur = 4;
                // Adjust text position so it's inside the slice
                ctx.fillText(names[i], radius - 20, 8);
                ctx.restore();
            }
        }

        function spinWheel() {
            if (isSpinning) return;
            if (names.length === 0) {
                logMessage("Add at least one name to the inventory!", "system");
                shakeElement(spinBtn);
                return;
            }
            if (names.length === 1) {
                logMessage("Only one participant... The choice is obvious!", "system");
            }

            isSpinning = true;
            spinBtn.disabled = true;
            winnerOverlay.classList.remove('active');

            const speedSetting = document.getElementById('speedSelect').value;
            let duration = 4000; // ms
            if (speedSetting === 'high') duration = 2000;
            if (speedSetting === 'low') duration = 6000;

            // Calculate rotation
            // Minimum 5 full spins (360 * 5) + random slice landing
            const extraSpins = 360 * (5 + Math.floor(Math.random() * 3)); 
            const randomOffset = Math.floor(Math.random() * 360);
            
            // We add this to the existing rotation to prevent spinning backwards
            const targetRotation = currentRotation + extraSpins + randomOffset;
            
            // Apply CSS transition
            canvas.style.transition = `transform ${duration}ms cubic-bezier(0.1, 0, 0.2, 1)`;
            canvas.style.transform = `rotate(-${targetRotation}deg)`; // Rotate counter-clockwise for CSS coords or clockwise

            // Wait for transition to end
            setTimeout(() => {
                finishSpin(targetRotation);
            }, duration);
        }

        function finishSpin(finalRotation) {
            isSpinning = false;
            spinBtn.disabled = false;
            
            // Reset transition so we can snap it back later without animating
            canvas.style.transition = 'none';
            
            // Calculate Winner
            // Pointer is at top (270 degrees or -90 degrees in canvas space relative to 0 at 3 o'clock)
            // Because we rotate the canvas DIV via CSS, we need to calculate where the pointer lands relative to the 0-index.
            
            const numSegments = names.length;
            const sliceAngle = 360 / numSegments;
            
            // Normalize rotation to 0-360
            const actualRotation = finalRotation % 360;
            
            // The pointer is static at the top. 
            // If we rotate the CANVAS negative (counter-clockwise), the segments move CCW.
            // Effectively, the pointer is moving 'forward' through the array.
            
            // Calculation logic: 
            // Index 0 starts at 0 degrees (3 o'clock).
            // We need to find which segment is at 270 degrees (12 o'clock).
            // Rotated angle is `actualRotation`.
            // Effective angle of index 0 = 0 - actualRotation.
            // We want to find index `i` where:
            // 270 degrees lies within the range of slice `i`.
            
            // Simplified math for wheel logic:
            // We rotated the canvas by `actualRotation` degrees.
            // The position under the pointer (270deg) corresponds to:
            // Angle on Canvas = (270 + actualRotation) % 360;
            const angleUnderPointer = (270 + actualRotation) % 360;
            
            // Index = floor(angleUnderPointer / sliceAngle)
            let winningIndex = Math.floor(angleUnderPointer / sliceAngle);
            
            // Safety clamp
            if (winningIndex >= numSegments) winningIndex = 0;

            const winnerName = names[winningIndex];
            
            // 1. Visual Update
            logMessage(`The wheel has chosen... ${winnerName}!`, "win");
            showWinnerOverlay(winnerName);

            // 2. Remove Logic (Requirement)
            setTimeout(() => {
                names.splice(winningIndex, 1);
                saveNames();
                renderGrid();
                
                // Reset rotation visually to 0 equivalent so next spin doesn't unwind
                // We keep the visual angle relative to 0 to maintain position, but since we removed the winner,
                // the segments changed. It's smoother to snap to a close equivalent or just 0.
                // For simplicity in this version, we snap back to 0 (visual snap) but it looks fine because we removed a segment.
                // Actually, let's keep the rotation so the wheel doesn't snap wildly.
                currentRotation = finalRotation; 
                // However, we need to redraw the wheel with fewer segments.
                // If we redraw, the canvas content changes. If we keep the rotation transform, the new segments will align with old angle.
                // This creates a cool effect where the wheel "resets" itself.
                drawWheel(); 
                
            }, 1500); // Slight delay so user sees the name on the wheel before it disappears
        }

        function showWinnerOverlay(name) {
            winnerNameText.innerText = name;
            winnerOverlay.classList.add('active');
            // Fake sound visual shake
            document.body.style.transform = "translate(1px, 1px)";
            setTimeout(() => document.body.style.transform = "none", 100);
        }

        function closeOverlay() {
            winnerOverlay.classList.remove('active');
        }

        // Keyboard support
        nameInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addName();
        });

    </script>
</body>
</html>
