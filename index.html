<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elder Gnome Roulette</title>
    <!-- Importing a pixel font to mimic OSRS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --osrs-bg-dark: #2b2620;
            --osrs-bg-panel: #5e5245;
            --osrs-border-light: #9e9081;
            --osrs-border-dark: #271c12;
            --osrs-text: #ff981f; /* Classic orange text */
            --osrs-text-white: #ffffff;
            --osrs-btn-bg: #5c5142;
            --osrs-btn-hover: #6e6251;
            --osrs-green: #00ff00; /* Gnome glow */
            --inventory-slot: #3e3529;
            --inventory-hover: #5f5242;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--osrs-bg-dark);
            font-family: 'VT323', monospace;
            color: var(--osrs-text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            background-image: radial-gradient(#3e3529 15%, transparent 16%), radial-gradient(#3e3529 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        /* --- UI Components --- */
        
        /* Beveled Borders Utility */
        .rs-panel {
            background-color: var(--osrs-bg-panel);
            border: 2px solid var(--osrs-border-dark);
            border-top-color: var(--osrs-border-light);
            border-left-color: var(--osrs-border-light);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            position: relative;
        }

        .rs-button {
            background-color: var(--osrs-btn-bg);
            border: 2px solid var(--osrs-border-dark);
            border-top-color: var(--osrs-border-light);
            border-left-color: var(--osrs-border-light);
            color: var(--osrs-text-white);
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            padding: 5px 15px;
            text-shadow: 1px 1px 0 #000;
        }
        .rs-button:active {
            border-top-color: var(--osrs-border-dark);
            border-left-color: var(--osrs-border-dark);
            border-bottom-color: var(--osrs-border-light);
            border-right-color: var(--osrs-border-light);
            transform: translateY(2px);
        }
        .rs-button:hover {
            background-color: var(--osrs-btn-hover);
            color: #ffff00;
        }
        .rs-button:disabled {
            background-color: #333;
            color: #777;
            cursor: not-allowed;
            border-color: #222;
        }

        /* --- Layout --- */

        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            text-shadow: 2px 2px 0 #000;
            z-index: 10;
        }
        
        h1 {
            margin: 0;
            font-size: 3rem;
            letter-spacing: 2px;
            color: #00ff00; /* Gnome Green */
            -webkit-text-stroke: 1px black;
        }
        h2 {
            margin: 0;
            font-size: 1.5rem;
            color: #d4c4a8; /* Quest text color */
        }

        main {
            display: flex;
            gap: 20px;
            width: 95%;
            max-width: 1000px;
            height: 70vh;
            justify-content: center;
        }

        /* --- Left Column: Roulette Stage --- */
        .stage-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            align-items: center;
        }

        .roulette-display {
            width: 100%;
            height: 200px;
            background-color: #000;
            border: 4px double var(--osrs-border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Scanline effect for retro feel */
        .roulette-display::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .current-name {
            font-size: 3rem;
            color: var(--osrs-text-white);
            text-shadow: 0 0 10px var(--osrs-green);
            z-index: 3;
            text-align: center;
            padding: 0 10px;
            word-break: break-all;
        }

        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .spin-btn {
            font-size: 2rem;
            flex-grow: 1;
            background-image: linear-gradient(to bottom, #5c5142, #42382c);
            font-weight: bold;
        }

        /* --- Right Column: Inventory/Players --- */
        .inventory-panel {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--osrs-border-dark);
            padding-bottom: 5px;
        }

        .input-group {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .rs-input {
            background: #000;
            border: 1px solid var(--osrs-border-light);
            color: var(--osrs-text-white);
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            flex-grow: 1;
            padding: 2px 5px;
            outline: none;
        }
        .rs-input:focus {
            border-color: var(--osrs-green);
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 4px;
            overflow-y: auto;
            padding: 4px;
            background-color: rgba(0,0,0,0.2);
            border: 1px inset var(--osrs-border-dark);
            min-height: 200px; /* Ensure grid has size when empty */
        }

        .inv-slot {
            aspect-ratio: 1;
            background-color: var(--inventory-slot);
            border: 1px solid #5e5245;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            font-size: 0.7rem;
            color: #ff981f;
            text-align: center;
            padding: 2px;
            word-break: break-all;
            line-height: 1;
            transition: background 0.2s;
        }

        .inv-slot:hover {
            background-color: var(--inventory-hover);
            border-color: var(--osrs-text-white);
        }
        
        /* Tooltip style for name on hover */
        .inv-slot:hover::after {
            content: attr(data-name);
            position: absolute;
            bottom: 105%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #ffff00;
            padding: 2px 5px;
            font-size: 1rem;
            border: 1px solid #ffff00;
            white-space: nowrap;
            z-index: 100;
            pointer-events: none;
        }

        .inv-slot img {
            width: 32px;
            height: 32px;
            image-rendering: pixelated;
        }
        
        /* Remove X on slot */
        .slot-remove {
            position: absolute;
            top: -2px;
            right: -2px;
            background: red;
            color: white;
            font-size: 0.8rem;
            width: 14px;
            height: 14px;
            line-height: 12px;
            text-align: center;
            border-radius: 50%;
            display: none;
        }
        .inv-slot:hover .slot-remove {
            display: block;
        }

        /* --- Footer: Chat/Log --- */
        .chat-container {
            width: 95%;
            max-width: 1000px;
            height: 120px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
        }

        .chat-history {
            flex-grow: 1;
            background-color: rgba(0,0,0,0.6);
            color: #fff;
            padding: 5px;
            font-size: 1rem;
            overflow-y: auto;
            border: 1px solid #444;
            border-bottom: none;
        }
        
        .chat-msg {
            margin-bottom: 2px;
        }
        .chat-msg.system { color: #ffff00; }
        .chat-msg.win { color: var(--osrs-green); font-weight: bold; }
        .chat-msg.info { color: #d4c4a8; }

        /* --- Animations & Overlays --- */
        @keyframes flashWinner {
            0% { background-color: transparent; }
            50% { background-color: rgba(0, 255, 0, 0.3); }
            100% { background-color: transparent; }
        }

        @keyframes levelUpPop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .winner-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .winner-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .level-up-box {
            text-align: center;
            border: 4px solid #fff;
            padding: 20px;
            background: linear-gradient(to bottom, #3e3529, #1a1510);
            box-shadow: 0 0 20px var(--osrs-green);
            animation: levelUpPop 0.5s ease-out forwards;
        }

        .level-up-title {
            font-size: 3rem;
            color: var(--osrs-green);
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 #000;
        }

        .winner-name {
            font-size: 4rem;
            color: #ffff00;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 #000;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            main { flex-direction: column; height: auto; }
            .stage-panel, .inventory-panel { height: 350px; }
            h1 { font-size: 2rem; }
        }

    </style>
</head>
<body>

    <header>
        <h1>Elder Gnome</h1>
        <h2>Group Roulette</h2>
    </header>

    <main>
        <!-- LEFT: Roulette -->
        <div class="rs-panel stage-panel">
            <div class="roulette-display" id="displayBox">
                <div class="current-name" id="nameDisplay">Empty</div>
            </div>

            <div class="controls">
                <button class="rs-button spin-btn" id="spinBtn" onclick="startSpin()">SPIN</button>
            </div>
            
            <div style="margin-top: 15px; width: 100%; text-align: center; font-size: 1rem;">
                <label style="color: #d4c4a8;">Speed: </label>
                <select id="speedSelect" class="rs-input" style="width: 80px; padding: 2px;">
                    <option value="high">High</option>
                    <option value="medium" selected>Normal</option>
                    <option value="low">Slow</option>
                </select>
            </div>
        </div>

        <!-- RIGHT: Inventory -->
        <div class="rs-panel inventory-panel">
            <div class="panel-header">
                <span style="color: #ff981f; font-size: 1.2rem;">Friends List</span>
                <span style="color: #fff; font-size: 1rem;" id="countDisplay">0/28</span>
            </div>

            <div class="input-group">
                <input type="text" id="nameInput" class="rs-input" placeholder="Enter name..." maxlength="12">
                <button class="rs-button" onclick="addName()">Add</button>
                <button class="rs-button" onclick="clearNames()" style="background-color: #800000;">X</button>
            </div>

            <div class="inventory-grid" id="inventoryGrid">
                <!-- Slots generated by JS -->
            </div>
        </div>
    </main>

    <!-- BOTTOM: Chat -->
    <div class="rs-panel chat-container">
        <div class="chat-history" id="chatHistory">
            <div class="chat-msg system">Welcome to the Elder Gnome roulette.</div>
            <div class="chat-msg info">Type a name and click Add to fill the inventory.</div>
        </div>
    </div>

    <!-- WINNER OVERLAY -->
    <div class="winner-overlay" id="winnerOverlay">
        <div class="level-up-box">
            <div class="level-up-title">Congratulations!</div>
            <div>The chosen Gnome is:</div>
            <div class="winner-name" id="winnerNameText">Name</div>
            <button class="rs-button" onclick="closeOverlay()">Click to continue</button>
        </div>
    </div>

    <script>
        // --- State Management ---
        let names = [];
        const STORAGE_KEY = 'elder_gnome_list_v1';
        
        // --- DOM Elements ---
        const nameInput = document.getElementById('nameInput');
        const grid = document.getElementById('inventoryGrid');
        const nameDisplay = document.getElementById('nameDisplay');
        const spinBtn = document.getElementById('spinBtn');
        const chatHistory = document.getElementById('chatHistory');
        const countDisplay = document.getElementById('countDisplay');
        const winnerOverlay = document.getElementById('winnerOverlay');
        const winnerNameText = document.getElementById('winnerNameText');

        // --- Init ---
        window.onload = () => {
            loadNames();
            // Removed default names as requested.
            // Just render whatever is loaded (which will be nothing on first run).
            renderGrid();
            
            if(names.length === 0) {
                logMessage("Inventory empty. Add some friends!", "system");
            } else {
                logMessage(`Loaded ${names.length} friends from storage.`, "info");
            }
        };

        // --- Core Functions ---

        function addName() {
            const val = nameInput.value.trim();
            if (!val) {
                shakeElement(nameInput);
                return;
            }
            if (names.length >= 28) {
                logMessage("Inventory full! Remove someone first.", "system");
                return;
            }
            addNameLogic(val);
            nameInput.value = '';
            nameInput.focus();
            logMessage(`Added ${val} to the list.`, "info");
        }

        function addNameLogic(name) {
            if (names.includes(name)) {
                logMessage(`${name} is already in the list.`, "system");
                return;
            }
            names.push(name);
            saveNames();
            renderGrid();
        }

        function removeName(index) {
            const removed = names[index];
            names.splice(index, 1);
            saveNames();
            renderGrid();
            logMessage(`Removed ${removed}.`, "info");
        }

        function clearNames() {
            if(confirm("Are you sure you want to clear the list?")) {
                names = [];
                saveNames();
                renderGrid();
                logMessage("List cleared.", "system");
            }
        }

        function renderGrid() {
            grid.innerHTML = '';
            countDisplay.innerText = `${names.length}/28`;

            names.forEach((name, index) => {
                const slot = document.createElement('div');
                slot.className = 'inv-slot';
                slot.title = name; // Simple browser tooltip as backup
                slot.setAttribute('data-name', name);
                
                // Create a visual representation (First letter or an icon)
                // Using text with small font size to fit names slightly or initials
                const text = document.createElement('span');
                text.innerText = name.substring(0, 3).toUpperCase(); 
                text.style.fontSize = '0.9rem';
                
                // Hover delete button
                const removeBtn = document.createElement('div');
                removeBtn.className = 'slot-remove';
                removeBtn.innerText = 'X';
                removeBtn.onclick = (e) => {
                    e.stopPropagation();
                    removeName(index);
                };

                slot.appendChild(text);
                slot.appendChild(removeBtn);

                // Add onclick to highlight in display (just a fun interaction)
                slot.onclick = () => {
                    nameDisplay.innerText = name;
                    nameDisplay.style.color = '#fff';
                };

                grid.appendChild(slot);
            });
        }

        function saveNames() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(names));
        }

        function loadNames() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    names = JSON.parse(saved);
                } catch (e) {
                    console.error("Save file corrupted");
                    names = [];
                }
            }
        }

        function logMessage(msg, type = "info") {
            const div = document.createElement('div');
            div.className = `chat-msg ${type}`;
            
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            div.innerText = `[${time}] ${msg}`;
            
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // --- Roulette Logic ---

        let isSpinning = false;
        
        function startSpin() {
            if (isSpinning) return;
            if (names.length === 0) {
                logMessage("Add at least one name to the inventory!", "system");
                shakeElement(spinBtn);
                return;
            }
            if (names.length === 1) {
                // Allow spinning with 1 name, just for effect, but log it
                logMessage("Only one participant... The choice is obvious!", "system");
            }

            isSpinning = true;
            spinBtn.disabled = true;
            nameDisplay.style.color = "var(--osrs-text)";
            winnerOverlay.classList.remove('active');

            const speedSetting = document.getElementById('speedSelect').value;
            let baseSpeed = 50;
            if (speedSetting === 'high') baseSpeed = 30;
            if (speedSetting === 'low') baseSpeed = 100;

            let maxSpins = 20 + Math.floor(Math.random() * 20); // Random total spins
            
            recursiveSpin(names[Math.floor(Math.random() * names.length)], 0, baseSpeed, maxSpins, names);
        }

        function recursiveSpin(currentName, iterations, delay, maxIterations, list) {
            if (iterations >= maxIterations) {
                finalizeSpin(list[Math.floor(Math.random() * list.length)]); // Final random pick
                return;
            }

            nameDisplay.innerText = currentName;
            // Highlight slot
            const idx = list.indexOf(currentName);
            const slots = document.querySelectorAll('.inv-slot');
            slots.forEach(s => s.style.borderColor = '#5e5245'); // reset
            if(idx !== -1 && slots[idx]) slots[idx].style.borderColor = '#00ff00';

            // Increment delay (slow down)
            const nextDelay = delay * 1.05; 
            
            // Pick next random name
            const nextName = list[Math.floor(Math.random() * list.length)];

            setTimeout(() => {
                recursiveSpin(nextName, iterations + 1, nextDelay, maxIterations, list);
            }, delay);
        }

        function finalizeSpin(winnerName) {
            // Ensure the winner is actually in the list (sanity check)
            if (!names.includes(winnerName)) {
                winnerName = names[Math.floor(Math.random() * names.length)];
            }

            nameDisplay.innerText = winnerName;
            nameDisplay.style.color = "var(--osrs-green)";
            
            // Visual Flash
            const displayBox = document.getElementById('displayBox');
            displayBox.style.animation = "flashWinner 0.5s ease-in-out 3";

            isSpinning = false;
            spinBtn.disabled = false;
            
            logMessage(`The wheel has chosen... ${winnerName}!`, "win");
            
            setTimeout(() => {
                showWinnerOverlay(winnerName);
                displayBox.style.animation = "";
            }, 1000);
        }

        function showWinnerOverlay(name) {
            winnerNameText.innerText = name;
            winnerOverlay.classList.add('active');
            // Play fake sound visual (shake screen slightly)
            document.body.style.transform = "translate(1px, 1px)";
            setTimeout(() => document.body.style.transform = "none", 100);
        }

        function closeOverlay() {
            winnerOverlay.classList.remove('active');
        }

        function shakeElement(el) {
            el.style.transform = "translateX(5px)";
            setTimeout(() => el.style.transform = "translateX(-5px)", 50);
            setTimeout(() => el.style.transform = "translateX(5px)", 100);
            setTimeout(() => el.style.transform = "none", 150);
        }

        // Allow Enter key to add names
        nameInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                addName();
            }
        });

    </script>
</body>
</html>
